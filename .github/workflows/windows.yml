name: Windows desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify isolated backend, IPC and UI
        shell: pwsh
        run: ./scripts/verify.ps1 -Python python
      - name: Build portable desktop
        shell: pwsh
        run: ./build-vue-desktop.ps1 -Python python -FreshProfile
      - name: Test packaged backend without external Codex
        run: python tests/smoke_packaged.py --skip-shared
      - name: Test actual desktop startup and IPC
        run: python tests/smoke_desktop.py
      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: AI-Link-Windows-x64
          path: dist-vue/AI Link/
          if-no-files-found: error
      - name: Upload verification summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          include-hidden-files: true
          path: |
            .artifacts/*.json
            .artifacts/renderer/vue-render-results.json
          if-no-files-found: ignore
